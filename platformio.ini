; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-c6-devkitc-1]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-c6-devkitc-1
framework = arduino
monitor_speed = 115200

; ESP32-C6 SuperMini: 4 MB di flash. La tabella standard riserva solo 1,31 MB
; al firmware; questa lascia 3 MB all'app e conserva una partizione dati.
board_upload.flash_size = 4MB
board_build.partitions = huge_app.csv

; ESP32-C6 non supporta il Bluetooth Classic/Bluedroid usato dagli ESP32
; originali: il provisioning usa NimBLE (solo BLE, compatibile con il C6).
lib_deps =
    adafruit/Adafruit GFX Library @ ^1.12.1
    adafruit/Adafruit SSD1306 @ ^2.5.15
    bblanchon/ArduinoJson @ ^7.4.2
    h2zero/NimBLE-Arduino @ ^2.3.7

build_flags = 
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

